<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>羽球收帳本</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: #f7f6f3; font-family: 'PingFang TC', 'Noto Sans TC', sans-serif; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const PAYMENT_METHODS = ["未收", "現金", "Line Pay"];
const METHOD_STYLE = {
  "未收":    { bg: "#f1f0ee", color: "#999",    border: "#ddd" },
  "現金":    { bg: "#e8f5e9", color: "#2e7d32", border: "#81c784" },
  "Line Pay":{ bg: "#e3f2fd", color: "#0a5c9a", border: "#64b5f6" },
};
const PRICE_MAP = { 2: 180, 3: 270, 4: 320 };
const PRICE_TIERS = [{ hours:2,price:180 },{ hours:3,price:270 },{ hours:4,price:320 }];
const STORAGE_KEY = "badminton_tracker_v1";

function getPrice(h) { return PRICE_MAP[h] ?? 0; }
function generateId() { return Math.random().toString(36).slice(2,9); }

function parseSessionHeader(line) {
  const idMatch   = line.match(/時段[（(]([A-Z])[)）]/);
  const timeMatch = line.match(/[（(](\d+)[~～](\d+)[)）]/);
  if (idMatch && timeMatch) return { id: idMatch[1], start: parseInt(timeMatch[1]), end: parseInt(timeMatch[2]) };
  return null;
}
function parseNameTime(raw) {
  const m = raw.match(/[（(](\d+)[-~～](\d+)[)）]/);
  if (m) return { start: parseInt(m[1]), end: parseInt(m[2]) };
  return null;
}
function cleanName(raw) {
  return raw.replace(/[（(]\d+[-~～]\d+[)）]/,"").replace(/^\d+[.、\s]+/,"").trim();
}

function parseRoster(text) {
  const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
  const sessions = [];
  let currentSession = null;

  for (const line of lines) {
    const header = parseSessionHeader(line);
    if (header) {
      currentSession = { ...header, duration: header.end - header.start, members: [] };
      sessions.push(currentSession);
      continue;
    }
    if (line.includes("後補")) continue;
    if (!currentSession) continue;
    const mm = line.match(/^\d+[.、\s]+(.*)/);
    if (mm) {
      const raw = mm[1].trim();
      if (!raw || /^[.。\-_]+$/.test(raw)) continue;
      const cleaned = cleanName(raw);
      if (!cleaned) continue;
      currentSession.members.push({ rawName: raw, cleanedName: cleaned, timeRange: parseNameTime(raw) });
    }
  }
  if (sessions.length === 0) return [];

  const allEntries = [];
  for (const sess of sessions) {
    const nameCount = {}, nameSeen = {};
    for (const m of sess.members) nameCount[m.cleanedName] = (nameCount[m.cleanedName]||0)+1;
    for (const m of sess.members) {
      nameSeen[m.cleanedName] = (nameSeen[m.cleanedName]||0)+1;
      allEntries.push({ sessionId:sess.id, sessionStart:sess.start, sessionEnd:sess.end, sessionDuration:sess.duration, cleanedName:m.cleanedName, timeRange:m.timeRange, occurrenceIndex:nameSeen[m.cleanedName] });
    }
  }

  const personMap = {};
  for (const e of allEntries) {
    const key = `${e.cleanedName}__${e.occurrenceIndex}`;
    if (!personMap[key]) personMap[key] = { name:e.cleanedName, sessions:[] };
    personMap[key].sessions.push({ sessionId:e.sessionId, sessionDuration:e.sessionDuration, timeRange:e.timeRange });
  }

  const sessInfoMap = {};
  for (const e of allEntries) {
    if (!sessInfoMap[e.sessionId]) sessInfoMap[e.sessionId] = { start:e.sessionStart, end:e.sessionEnd, duration:e.sessionDuration };
  }

  return Object.values(personMap).map(p => {
    const uniqueSessions = [...new Map(p.sessions.map(s=>[s.sessionId,s])).values()];
    const intervals = [];
    for (const sess of uniqueSessions) {
      const info = sessInfoMap[sess.sessionId];
      if (!info) continue;
      intervals.push(sess.timeRange ? { start:sess.timeRange.start, end:sess.timeRange.end } : { start:info.start, end:info.end });
    }
    intervals.sort((a,b)=>a.start-b.start);
    const merged = [];
    for (const iv of intervals) {
      if (merged.length && iv.start <= merged[merged.length-1].end)
        merged[merged.length-1].end = Math.max(merged[merged.length-1].end, iv.end);
      else merged.push({...iv});
    }
    const hours = merged.reduce((s,iv)=>s+(iv.end-iv.start),0);
    return { id:generateId(), name:p.name, hours:Math.max(2,Math.min(4,hours)), startHour:merged[0]?.start??null, endHour:merged[merged.length-1]?.end??null, method:"未收" };
  });
}

function Badge({ label, count, color, bg }) {
  if (!count) return null;
  return <div style={{ background:bg, color, borderRadius:20, padding:"4px 12px", fontSize:12, fontWeight:700 }}>{label} {count} 人</div>;
}

export default function App() {
  const [view, setView]           = useState("import");
  const [rawText, setRawText]     = useState("");
  const [parseError, setParseError] = useState("");
  const [members, setMembers]     = useState([]);
  const [nameInput, setNameInput] = useState("");
  const [selectedHours, setSelectedHours] = useState(2);
  const [sessionTitle, setSessionTitle] = useState(()=>{
    const n=new Date(); return `${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()} 場次`;
  });
  const [editingTitle, setEditingTitle] = useState(false);
  const [titleInput, setTitleInput]     = useState(sessionTitle);
  const [loaded, setLoaded] = useState(false);

  // ── 讀取 localStorage ──
  useEffect(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data.members)      setMembers(data.members);
        if (data.sessionTitle) { setSessionTitle(data.sessionTitle); setTitleInput(data.sessionTitle); }
        if (data.members?.length > 0) setView("list");
      }
    } catch(e) {}
    setLoaded(true);
  }, []);

  // ── 寫入 localStorage ──
  useEffect(() => {
    if (!loaded) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ members, sessionTitle }));
    } catch(e) {}
  }, [members, sessionTitle, loaded]);

  const handleImport = () => {
    if (!rawText.trim()) { setParseError("請貼上名單內容"); return; }
    const parsed = parseRoster(rawText);
    if (parsed.length === 0) { setParseError("無法解析出成員，請確認格式正確"); return; }
    setMembers(parsed); setParseError(""); setView("list");
  };

  const addMember = () => {
    const name = nameInput.trim();
    if (!name) return;
    setMembers(prev => [...prev, { id:generateId(), name, hours:selectedHours, startHour:null, endHour:null, method:"未收" }]);
    setNameInput("");
  };

  const removeMember = (id) => setMembers(prev=>prev.filter(m=>m.id!==id));

  const cycleMethod = (id) => {
    setMembers(prev=>prev.map(m=>{
      if (m.id!==id) return m;
      const idx = PAYMENT_METHODS.indexOf(m.method);
      return { ...m, method:PAYMENT_METHODS[(idx+1)%PAYMENT_METHODS.length] };
    }));
  };

  const updateHours = (id, hours) => setMembers(prev=>prev.map(m=>m.id!==id?m:{...m,hours}));

  const clearAll = () => {
    if (!window.confirm("確定要清空本場資料嗎？")) return;
    setMembers([]); setRawText(""); setView("import");
    const n=new Date(); const t=`${n.getFullYear()}/${n.getMonth()+1}/${n.getDate()} 場次`;
    setSessionTitle(t); setTitleInput(t);
  };

  const stats = useMemo(() => {
    const total = members.reduce((s,m)=>s+getPrice(m.hours),0);
    const cashMembers = members.filter(m=>m.method==="現金");
    const lineMembers = members.filter(m=>m.method==="Line Pay");
    const collected   = [...cashMembers,...lineMembers].reduce((s,m)=>s+getPrice(m.hours),0);
    const cashTotal   = cashMembers.reduce((s,m)=>s+getPrice(m.hours),0);
    const lineTotal   = lineMembers.reduce((s,m)=>s+getPrice(m.hours),0);
    const pending     = total - collected;
    const unpaidCount = members.filter(m=>m.method==="未收").length;
    const hourMap = {};
    for (const m of members) {
      if (m.startHour==null||m.endHour==null) continue;
      for (let h=m.startHour; h<m.endHour; h++) hourMap[h]=(hourMap[h]||0)+1;
    }
    const hourStats = Object.entries(hourMap).map(([h,c])=>({hour:parseInt(h),count:c})).sort((a,b)=>a.hour-b.hour);
    return { total, collected, pending, cashCount:cashMembers.length, lineCount:lineMembers.length, unpaidCount, cashTotal, lineTotal, hourStats };
  }, [members]);

  const iS = { fontSize:14, border:"1px solid #ddd", borderRadius:8, padding:"10px 12px", outline:"none", flex:1, minWidth:100, fontFamily:"inherit" };

  return (
    <div style={{ minHeight:"100vh", background:"#f7f6f3", paddingBottom:60 }}>

      {/* Header */}
      <div style={{ background:"#1a1a1a", color:"#fff", padding:"24px 20px 16px" }}>
        <div style={{ fontSize:11, letterSpacing:3, color:"#666", marginBottom:6 }}>羽球收帳本</div>
        {editingTitle ? (
          <input autoFocus value={titleInput} onChange={e=>setTitleInput(e.target.value)}
            onBlur={()=>{setSessionTitle(titleInput);setEditingTitle(false);}}
            onKeyDown={e=>{if(e.key==="Enter"){setSessionTitle(titleInput);setEditingTitle(false);}}}
            style={{ fontSize:20, fontWeight:700, color:"#fff", background:"transparent", border:"none", borderBottom:"2px solid #555", outline:"none", width:"100%", paddingBottom:2, fontFamily:"inherit" }} />
        ) : (
          <div onClick={()=>{setTitleInput(sessionTitle);setEditingTitle(true);}}
            style={{ fontSize:20, fontWeight:700, cursor:"text", display:"flex", alignItems:"center", gap:8 }}>
            {sessionTitle} <span style={{ fontSize:13, color:"#555" }}>✏️</span>
          </div>
        )}
        <div style={{ marginTop:10, display:"flex", gap:16 }}>
          {PRICE_TIERS.map(t=>(
            <div key={t.hours} style={{ fontSize:12, color:"#666" }}>
              <span style={{ color:"#f0c040", fontWeight:700 }}>{t.hours}hr</span>
              <span style={{ marginLeft:4 }}>${t.price}</span>
              {t.hours===4 && <span style={{ marginLeft:4, color:"#f0c040" }}>★</span>}
            </div>
          ))}
        </div>
      </div>

      {/* Tab Bar */}
      <div style={{ display:"flex", background:"#fff", borderBottom:"1px solid #eee" }}>
        {[{key:"import",label:"📋 貼上名單"},{key:"list",label:`💰 收帳（${members.length}人）`}].map(tab=>(
          <button key={tab.key} onClick={()=>setView(tab.key)} style={{
            flex:1, padding:"14px 0", fontSize:13, fontWeight:700,
            background:"none", border:"none", cursor:"pointer",
            borderBottom:view===tab.key?"3px solid #1a1a1a":"3px solid transparent",
            color:view===tab.key?"#1a1a1a":"#aaa", fontFamily:"inherit",
          }}>{tab.label}</button>
        ))}
      </div>

      {/* IMPORT VIEW */}
      {view==="import" && (
        <div style={{ padding:16 }}>
          <div style={{ fontSize:12, color:"#aaa", marginBottom:8, lineHeight:1.6 }}>
            將 Line 群組的報名名單直接貼入，程式會自動解析時數與人數。<br/>
            支援格式：<span style={{ color:"#555" }}>時段(C)(・)(18~20)</span>，成員以數字序號開頭。
          </div>
          <textarea value={rawText} onChange={e=>setRawText(e.target.value)}
            placeholder={"時段(C)(・)(18~20)\n1. 🌸GMeiMei🌸\n2. EN(18-21)\n..."}
            style={{ width:"100%", height:260, fontSize:13, lineHeight:1.7, border:"1px solid #ddd", borderRadius:10, padding:12, outline:"none", resize:"vertical", fontFamily:"inherit", background:"#fff" }} />
          {parseError && <div style={{ color:"#c62828", fontSize:13, marginTop:8 }}>⚠️ {parseError}</div>}
          <button onClick={handleImport} style={{ marginTop:12, width:"100%", padding:"14px 0", background:"#1a1a1a", color:"#fff", border:"none", borderRadius:10, fontSize:15, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>
            自動解析並帶入 →
          </button>
          {members.length > 0 && (
            <button onClick={()=>setView("list")} style={{ marginTop:8, width:"100%", padding:"12px 0", background:"#fff", color:"#1a1a1a", border:"2px solid #1a1a1a", borderRadius:10, fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>
              ← 回到收帳列表
            </button>
          )}
          <div style={{ marginTop:20, background:"#fff", borderRadius:10, padding:14, fontSize:12, color:"#888", lineHeight:1.8 }}>
            <div style={{ fontWeight:700, color:"#555", marginBottom:6 }}>解析規則</div>
            <div>• 有括號時間 → 按括號時數計算（如 EN(18-21) = 3hr）</div>
            <div>• 無括號 → 按出現的時段數加總（C+D都有 = 4hr）</div>
            <div>• 同時段同名出現兩次 → 視為兩人</div>
            <div>• 「後補」標題行忽略，後補成員照樣帶入</div>
            <div>• 帶入後可手動調整每人時數</div>
          </div>
        </div>
      )}

      {/* LIST VIEW */}
      {view==="list" && (
        <>
          {/* Stats Bar */}
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", background:"#fff", borderBottom:"1px solid #eee" }}>
            {[
              { label:"應收總額", value:`$${stats.total}`,    color:"#333" },
              { label:"已收",    value:`$${stats.collected}`, color:"#2e7d32" },
              { label:"未收",    value:`$${stats.pending}`,   color:stats.pending>0?"#c62828":"#aaa" },
            ].map(s=>(
              <div key={s.label} style={{ padding:"14px 0", textAlign:"center", borderRight:"1px solid #eee" }}>
                <div style={{ fontSize:11, color:"#aaa", marginBottom:3 }}>{s.label}</div>
                <div style={{ fontSize:20, fontWeight:800, color:s.color }}>{s.value}</div>
              </div>
            ))}
          </div>

          {/* Badge row */}
          {members.length > 0 && (
            <div style={{ display:"flex", gap:8, padding:"10px 16px", background:"#fff", borderBottom:"1px solid #eee", flexWrap:"wrap" }}>
              <Badge label="現金"    count={stats.cashCount}   color="#2e7d32" bg="#e8f5e9" />
              <Badge label="Line Pay" count={stats.lineCount}  color="#0a5c9a" bg="#e3f2fd" />
              <Badge label="未付"    count={stats.unpaidCount} color="#c62828" bg="#ffebee" />
            </div>
          )}

          {/* Manual Add */}
          <div style={{ padding:"14px 16px", background:"#fff", marginTop:10, borderTop:"1px solid #eee", borderBottom:"1px solid #eee" }}>
            <div style={{ fontSize:12, color:"#aaa", marginBottom:8, letterSpacing:1 }}>手動新增</div>
            <div style={{ display:"flex", gap:8, marginBottom:8 }}>
              <input placeholder="姓名 / 暱稱" value={nameInput} onChange={e=>setNameInput(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&addMember()} style={iS} />
              <button onClick={addMember} style={{ background:"#1a1a1a", color:"#fff", border:"none", borderRadius:8, padding:"10px 16px", fontSize:14, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap", fontFamily:"inherit" }}>＋ 加入</button>
            </div>
            <div style={{ display:"flex", gap:8 }}>
              {PRICE_TIERS.map(t=>(
                <button key={t.hours} onClick={()=>setSelectedHours(t.hours)} style={{
                  flex:1, padding:"8px 0", borderRadius:8,
                  border:selectedHours===t.hours?"2px solid #1a1a1a":"2px solid #e0e0e0",
                  background:selectedHours===t.hours?"#1a1a1a":"#fafafa",
                  color:selectedHours===t.hours?"#fff":"#666",
                  fontWeight:700, fontSize:12, cursor:"pointer", fontFamily:"inherit",
                }}>{t.hours}hr · ${t.price}</button>
              ))}
            </div>
          </div>

          {/* Member List */}
          <div style={{ padding:"10px 16px" }}>
            {members.length===0 ? (
              <div style={{ textAlign:"center", padding:"48px 0", color:"#bbb", fontSize:14 }}>
                尚未有成員<br/><span style={{ fontSize:12 }}>請先到「貼上名單」頁面匯入</span>
              </div>
            ) : members.map((m,i)=>{
              const amount = getPrice(m.hours);
              const ms = METHOD_STYLE[m.method];
              return (
                <div key={m.id} style={{ background:"#fff", border:`1px solid ${m.method!=="未收"?ms.border:"#eee"}`, borderRadius:12, padding:"12px 14px", marginBottom:8, display:"flex", alignItems:"center", gap:10 }}>
                  <div style={{ width:26, height:26, borderRadius:"50%", background:"#f0f0f0", display:"flex", alignItems:"center", justifyContent:"center", fontSize:11, color:"#999", flexShrink:0 }}>{i+1}</div>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontWeight:700, fontSize:15, marginBottom:5 }}>{m.name}</div>
                    <div style={{ display:"flex", gap:5, alignItems:"center" }}>
                      {PRICE_TIERS.map(t=>(
                        <button key={t.hours} onClick={()=>updateHours(m.id,t.hours)} style={{
                          padding:"2px 9px", borderRadius:20, fontSize:11, fontWeight:700,
                          border:m.hours===t.hours?"1.5px solid #1a1a1a":"1.5px solid #ddd",
                          background:m.hours===t.hours?"#1a1a1a":"#f5f5f5",
                          color:m.hours===t.hours?"#fff":"#aaa", cursor:"pointer", fontFamily:"inherit",
                        }}>{t.hours}hr</button>
                      ))}
                      <span style={{ fontSize:14, fontWeight:800, color:"#333", marginLeft:2 }}>${amount}</span>
                    </div>
                  </div>
                  <button onClick={()=>cycleMethod(m.id)} style={{ background:ms.bg, color:ms.color, border:`1.5px solid ${ms.border}`, borderRadius:20, padding:"6px 12px", fontSize:13, fontWeight:700, cursor:"pointer", whiteSpace:"nowrap", minWidth:80, textAlign:"center", fontFamily:"inherit" }}>
                    {m.method==="未收"?"未收 →":m.method}
                  </button>
                  <button onClick={()=>removeMember(m.id)} style={{ background:"none", border:"none", color:"#ccc", fontSize:18, cursor:"pointer", padding:"0 2px", lineHeight:1 }}>×</button>
                </div>
              );
            })}
          </div>

          {/* Footer Summary */}
          {members.length > 0 && (
            <>
            <div style={{ margin:"0 16px 10px", background:"#1a1a1a", borderRadius:12, padding:"16px 20px", color:"#fff" }}>
              <div style={{ fontSize:11, color:"#555", marginBottom:10, letterSpacing:2 }}>本場小結</div>
              <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                <span style={{ color:"#aaa", fontSize:14 }}>共 {members.length} 人</span>
                <span style={{ fontWeight:700 }}>應收 ${stats.total}</span>
              </div>
              {stats.cashCount>0 && (
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                  <span style={{ color:"#81c784", fontSize:14 }}>💵 現金（{stats.cashCount} 人）</span>
                  <span style={{ color:"#81c784", fontWeight:700 }}>${stats.cashTotal}</span>
                </div>
              )}
              {stats.lineCount>0 && (
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:6 }}>
                  <span style={{ color:"#64b5f6", fontSize:14 }}>📱 Line Pay（{stats.lineCount} 人）</span>
                  <span style={{ color:"#64b5f6", fontWeight:700 }}>${stats.lineTotal}</span>
                </div>
              )}
              <div style={{ borderTop:"1px solid #333", marginTop:8, paddingTop:8 }}>
                <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                  <span style={{ color:"#81c784", fontSize:14 }}>✓ 已收合計</span>
                  <span style={{ color:"#81c784", fontWeight:700 }}>${stats.collected}</span>
                </div>
                {stats.pending>0 ? (
                  <div style={{ display:"flex", justifyContent:"space-between" }}>
                    <span style={{ color:"#ef9a9a", fontSize:14 }}>⏳ 待收（{stats.unpaidCount} 人）</span>
                    <span style={{ color:"#ef9a9a", fontWeight:700 }}>${stats.pending}</span>
                  </div>
                ) : (
                  <div style={{ textAlign:"center", color:"#81c784", fontWeight:700 }}>✅ 全部收款完成！</div>
                )}
              </div>
            </div>

            {stats.hourStats.length>0 && (
              <div style={{ margin:"0 16px 10px", background:"#fff", borderRadius:12, padding:"16px 20px" }}>
                <div style={{ fontSize:11, color:"#aaa", marginBottom:12, letterSpacing:2 }}>每小時在場人數</div>
                {stats.hourStats.map(({hour,count})=>{
                  const maxC = Math.max(...stats.hourStats.map(h=>h.count));
                  return (
                    <div key={hour} style={{ marginBottom:10 }}>
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                        <span style={{ fontSize:13, color:"#555", fontWeight:700 }}>{hour}:00 – {hour+1}:00</span>
                        <span style={{ fontSize:13, fontWeight:800, color:"#1a1a1a" }}>{count} 人</span>
                      </div>
                      <div style={{ background:"#f0f0f0", borderRadius:4, height:8, overflow:"hidden" }}>
                        <div style={{ width:`${Math.round(count/maxC*100)}%`, height:"100%", background:"#1a1a1a", borderRadius:4 }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {/* 清空按鈕 */}
            <div style={{ margin:"0 16px 20px" }}>
              <button onClick={clearAll} style={{ width:"100%", padding:"12px 0", background:"#fff", color:"#c62828", border:"1.5px solid #ffcdd2", borderRadius:10, fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"inherit" }}>
                🗑 清空本場，開始新場次
              </button>
            </div>
            </>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
